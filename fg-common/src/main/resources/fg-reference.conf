# Flight Gateway reference configuration (design doc §7). Override via gateway.conf or -Dfg.*.
fg {
  flight {
    port = 32010
    # 服务端 TLS（D25）：PEM 双文件或 KeyStore(PKCS12/JKS) 二选一；可选 mTLS 客户端验证
    tls {
      enabled = false
      # PEM 模式：证书链 + 私钥文件路径（PKCS8/PKCS1）
      cert-chain = ""
      private-key = ""
      # KeyStore 模式：.p12（默认）/ .jks
      key-store = ""
      key-store-password = ""
      # 别名空 = 取首个 PrivateKey 条目；key-password 空 = 回落 key-store-password
      key-store-alias = ""
      key-password = ""
      # 可选 mTLS：客户端证书 CA（PEM）——ClientAuth.REQUIRE
      client-ca-cert = ""
    }
  }

  memory.max = 2GB

  # 指标暴露（D26）：Prometheus 文本格式 GET /metrics（JVM 基线 + fg.* 业务指标）；
  # port=0 = 随机端口（测试用）。关闭（enabled=false）回落 SimpleMeterRegistry（无 HTTP 面）。
  metrics {
    enabled = true
    port = 9091
  }

  # OperationStore (PostgreSQL)
  db {
    url = "jdbc:postgresql://localhost:5432/flightgateway"
    username = "fg"
    password = "fg"
    max.pool.size = 10
  }

  zk {
    # 非空 → M2 引擎管理（ZK 发现 + share level 路由 + 拉起/恢复）；空（默认）→ M1 固定单引擎
    addresses = ""
    namespace = "flight-gateway"
  }

  engine {
    # share level 路由（D22，Kyuubi 语义）：CONNECTION=每 fg 会话一引擎（refId=sessionId）、
    # USER=每用户一引擎、GROUP=每组一引擎（share.group-mapping）、SERVER=全局共享（share.server-user）
    share.level = "USER"
    share.subdomain = "default"
    # SERVER 路由用户（share.level=SERVER 时生效）
    share.server-user = "shared"
    # GROUP 映射（"user:group" 列表/逗号串；未映射回落 user 本身）
    share.group-mapping = []
    # 冷启动/就绪上限（拉起后按 refId 轮询 ZK 至此时长）
    initialize.timeout = 120s
    # 引擎空闲自杀（launcher 下发 fg.engine.idle.timeout）
    idle.timeout = 30m
    # 网关侧并发拉起上限（semaphore）
    launch.max.concurrent = 5
    # 引擎最长存活（0=不限；到期摘流→排空→停，launcher 下发 fg.engine.max-lifetime）
    max-lifetime = 0
    # CONNECTION never-connected fast-fail：超此时长仍无任何 Connect 会话即自杀
    max-initial-wait = 10m
    # 引擎侧 ZK 会话 LOST 宽限（超时未恢复即停）
    zk.session-grace = 30s
    # 恢复（sessionStatus connect-refused → recover）重试界
    open.max-attempts = 3
    open.retry-wait = 2s
    creds.mode = "launch-static"
    # M1: single fixed engine address; M2 replaces with ZK discovery
    spark.connect.uri = "sc://localhost:15002"
    # 会话生命周期管理面端口（D20，fg-spark-app FgSessionAdmin；主机同 connect.uri）
    spark.admin.port = 15003
    spark.route = "B"

    # 拉起参数（D22，SparkLauncher；local 模式 = 网关本机 + 端口段分配）
    spark.launch {
      master = "local[*]"
      deploy-mode = "client"
      # $SPARK_HOME；空 = 拒绝拉起（配置错误 fast-fail）
      home = ""
      # fg-spark-app shaded jar 路径
      app-jar = ""
      # 随引擎携带的 extra jars（cluster 模式带 sink 等）
      extra-jars = []
      driver-memory = "1g"
      # 任意 spark conf 透传（对象键即 conf 键，如 spark.driver.memory）；
      # conf-file = spark-defaults.conf 风格 properties 文件（公共基础配置，撞键时本对象覆盖）
      conf { }
      conf-file = ""
      # cluster 模式固定端口（引擎落不同节点；同节点冲突为已知边界）
      cluster.connect-port = 15002
      cluster.admin-port = 15003
      # local 模式端口段（bind 试探分配）
      port-range = "16000-16999"
      admin-port-range = "17000-17999"
      # 引擎 stdout/err 日志目录（~/fg-e2e/engine-logs/{refId}.log）
      log-dir = "~/fg-e2e/engine-logs"
    }
  }

  result {
    bucket = "fg-results"
    prefix = "results"
    s3 {
      endpoint = "http://localhost:9000"
      access-key = "minioadmin"
      secret-key = "minioadmin"
    }
    presign.ttl = 1h
    retention = 24h
    endpoint.mode = "relay"
    relay.single-stream = false
    batch.max.records = 16384
    # fg.result.partitions: unset = natural partitions; 1 = single object; K = exact K parts
    ticket.secret = "change-me"
    ticket.ttl = 24h
    # D27 scroll 页参数（DoGet + x-fg-page-offset/limit 头）：limit 缺省值与服务端上限
    #（防 limit=MAX_VALUE 式隐性全量；offset ≥ 总行数返回空页）
    page.default-rows = 1000
    page.max-rows = 65536
  }

  query {
    timeout = 600s
    prepare.timeout = 30s
    reconcile.window = 60s
  }

  # 命令（非 SELECT：SET/SHOW/DESCRIBE/EXPLAIN/USE/DDL/DML，design D17/D18）
  command {
    # 约束：必须保持 < fg.query.timeout——孤儿 COMMAND 行（触发实例死亡）无 manifest
    # 可对账，由 QueryTimeoutSweeper 在 fg.query.timeout 兜底迁 FAILED，命令自身须先到点
    timeout = 300s
    # 命令结果内联上限（累计 arrow_batch 字节，超出 cancel+FAILED——防大结果撑爆
    # fg_operation 行内 command_result；大结果应改写成 SELECT 走物化主链路）
    result.max-bytes = 1048576
  }

  poll {
    max-wait = 60s
    db.interval = 2s
  }

  relay {
    enabled = true
    client.readiness.timeout = 50s
  }

  executor.relay.size = 64

  auth {
    basic {
      username = "fg"
      password = "fg"
      # 多用户（D22 USER share e2e）："user:pass" 列表/逗号串；空 = 回落单键对（M1 兼容）
      users = []
    }
    # Bearer token 签名密钥（HMAC 无状态 token——重启/多实例兼容；多实例须一致）
    token {
      # 空 = 回落 fg.result.ticket.secret（网关级共享密钥）
      secret = ""
      # 有效期（默认 0=不过期；客户端无 401 自动重试，启用 TTL 意味着到期连接需重连）
      ttl = 0
    }
  }
}
