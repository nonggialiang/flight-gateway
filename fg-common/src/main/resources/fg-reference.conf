# Flight Gateway reference configuration (design doc §7). Override via gateway.conf or -Dfg.*.
fg {
  flight {
    port = 32010
    # M1 开发态默认关闭（无证书装配）；M3 TLS 强化时启用（KeyStore→PEM，照 Dremio 范式）
    tls.enabled = false
  }

  memory.max = 2GB

  # OperationStore (PostgreSQL)
  db {
    url = "jdbc:postgresql://localhost:5432/flightgateway"
    username = "fg"
    password = "fg"
    max.pool.size = 10
  }

  zk {
    addresses = ""
    namespace = "flight-gateway"
  }

  engine {
    share.level = "USER"
    share.subdomain = "default"
    initialize.timeout = 120s
    idle.timeout = 30m
    launch.max.concurrent = 5
    creds.mode = "launch-static"
    # M1: single fixed engine address; M2 replaces with ZK discovery
    spark.connect.uri = "sc://localhost:15002"
    # 会话生命周期管理面端口（D20，fg-spark-app FgSessionAdmin；主机同 connect.uri）
    spark.admin.port = 15003
    spark.route = "B"
  }

  result {
    bucket = "fg-results"
    prefix = "results"
    s3 {
      endpoint = "http://localhost:9000"
      access-key = "minioadmin"
      secret-key = "minioadmin"
    }
    presign.ttl = 1h
    retention = 24h
    endpoint.mode = "relay"
    relay.single-stream = false
    batch.max.records = 16384
    # fg.result.partitions: unset = natural partitions; 1 = single object; K = exact K parts
    ticket.secret = "change-me"
    ticket.ttl = 24h
  }

  query {
    timeout = 600s
    prepare.timeout = 30s
    reconcile.window = 60s
  }

  # 命令（非 SELECT：SET/SHOW/DESCRIBE/EXPLAIN/USE/DDL/DML，design D17/D18）
  command {
    # 约束：必须保持 < fg.query.timeout——孤儿 COMMAND 行（触发实例死亡）无 manifest
    # 可对账，由 QueryTimeoutSweeper 在 fg.query.timeout 兜底迁 FAILED，命令自身须先到点
    timeout = 300s
    # 命令结果内联上限（累计 arrow_batch 字节，超出 cancel+FAILED——防大结果撑爆
    # fg_operation 行内 command_result；大结果应改写成 SELECT 走物化主链路）
    result.max-bytes = 1048576
  }

  poll {
    max-wait = 60s
    db.interval = 2s
  }

  relay {
    enabled = true
    client.readiness.timeout = 50s
  }

  executor.relay.size = 64

  auth {
    basic {
      username = "fg"
      password = "fg"
    }
  }
}
