# Flight Gateway reference configuration (design doc §7). Override via gateway.conf or -Dfg.*.
fg {
  flight {
    port = 32010
    tls.enabled = true
  }

  memory.max = 2GB

  # OperationStore (PostgreSQL)
  db {
    url = "jdbc:postgresql://localhost:5432/flightgateway"
    username = "fg"
    password = "fg"
    max.pool.size = 10
  }

  zk {
    addresses = ""
    namespace = "flight-gateway"
  }

  engine {
    share.level = "USER"
    share.subdomain = "default"
    initialize.timeout = 120s
    idle.timeout = 30m
    launch.max.concurrent = 5
    creds.mode = "launch-static"
    # M1: single fixed engine address; M2 replaces with ZK discovery
    spark.connect.uri = "sc://localhost:15002"
    spark.route = "B"
  }

  result {
    bucket = "fg-results"
    prefix = "results"
    s3 {
      endpoint = "http://localhost:9000"
      access-key = "minioadmin"
      secret-key = "minioadmin"
    }
    presign.ttl = 1h
    retention = 24h
    endpoint.mode = "relay"
    relay.single-stream = false
    batch.max.records = 16384
    # fg.result.partitions: unset = natural partitions; 1 = single object; K = exact K parts
    ticket.secret = "change-me"
    ticket.ttl = 24h
  }

  query {
    timeout = 600s
    prepare.timeout = 30s
    reconcile.window = 60s
  }

  poll {
    max-wait = 60s
    db.interval = 2s
  }

  relay {
    enabled = true
    client.readiness.timeout = 50s
  }

  executor.relay.size = 64

  auth {
    basic {
      username = "fg"
      password = "fg"
    }
  }
}
